# cart-config:chart 建底稿初值(config.yaml);autoconfig 重填 workers 段(落点也可以是下面的覆盖层 CM)。
# Helm 3 三方合并:模板不变时 upgrade 不覆盖 autoconfig 写的 live 值。
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "cart.configMapName" . }}
  namespace: {{ .Release.Namespace }}
  labels: {{- include "cart.labels" . | nindent 4 }}
data:
  config.yaml: |
{{ .Values.baseConfig | indent 4 }}
{{- include "cart.extraConfigs.check" . }}
{{- /* 带 content 的覆盖层由本 chart 建 CM;existingConfigMap 的不建。 */}}
{{- range $i, $e := .Values.extraConfigs }}
{{- $r := include "cart.extraConfig.resolve" (list $ $e $i) | fromYaml }}
{{- if $r.inline }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $r.configMap }}
  namespace: {{ $.Release.Namespace }}
  labels: {{- include "cart.labels" $ | nindent 4 }}
data:
  {{ $r.key }}: |
{{ $e.content | default "" | indent 4 }}
{{- end }}
{{- end }}
