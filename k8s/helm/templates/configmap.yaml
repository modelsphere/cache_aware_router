# cart-config:chart 建初值(config.yaml,含 server 块 + 初始 workers),autoconfig 更新
# (autoconfig 只重填 workers 段;Helm 3 三方合并:模板不变时 upgrade 不覆盖 autoconfig 写的 live 值)。
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "cart.configMapName" . }}
  namespace: {{ .Release.Namespace }}
  labels: {{- include "cart.labels" . | nindent 4 }}
data:
  config.yaml: |
{{ .Values.baseConfig | indent 4 }}
