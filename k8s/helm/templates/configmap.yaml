{{- include "cart.configOverlays.check" . }}
# cart-config:chart 建底稿 config.yaml + 各 overlay key。
# 标了 autoconfig 的 key 不在这里渲染 —— 模板不出这个 key,helm upgrade 的三方合并就没有它,
# autoconfig 写进去的 workers 不会被 upgrade 盖掉。
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "cart.configMapName" . }}
  namespace: {{ .Release.Namespace }}
  labels: {{- include "cart.labels" . | nindent 4 }}
data:
  config.yaml: |
{{ .Values.baseConfig | indent 4 }}
  {{- range .Values.configOverlays }}
  {{- if not .autoconfig }}
  {{ .key }}: |
{{ .content | default "" | indent 4 }}
  {{- end }}
  {{- end }}
