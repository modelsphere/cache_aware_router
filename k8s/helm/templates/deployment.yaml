apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "cart.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels: {{- include "cart.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicas }}
  selector:
    matchLabels: {{- include "cart.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels: {{- include "cart.selectorLabels" . | nindent 8 }}
      {{- with .Values.podAnnotations }}
      annotations: {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      {{- if .Values.terminationGracePeriodSeconds }}
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}   # 硬切刀:到点 SIGKILL 强砍在途流。cart 也要排空长流(SSE 转发),须按最长流式响应设,别吃 k8s 默认 30s(见 openresty chart)
      {{- end }}
      {{- if .Values.ha.enabled }}
      serviceAccountName: {{ include "cart.fullname" . }}   # ha-gate 用它管 Lease
      {{- end }}
      {{- if .Values.reload.enabled }}
      shareProcessNamespace: true
      {{- end }}
      {{- if .Values.waitForWorkers }}
      initContainers:
        # 等 autoconfig 把真 workers(url: http://...)写进 config.yaml 再启 cart —— CART 拒绝空 workers 会崩溃循环。
        # 停在 Init 而非 CrashLoop;workers 就绪(或 ~10min 超时兜底)后放行。用 cart 镜像自身(已在,免额外拉)。
        - name: wait-workers
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          command: ["sh", "-c", "for i in $(seq 1 300); do grep -qE 'url:[[:space:]]*http' /workspace/configs/config.yaml 2>/dev/null && { echo 'workers ready'; exit 0; }; echo \"[$i] 等 autoconfig 写 workers...\"; sleep 2; done; echo 'timeout, 仍放行'; exit 0"]
          volumeMounts:
            - name: cfg
              mountPath: /workspace/configs
      {{- end }}
      containers:
        - name: cart
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["sh", "-c", "ulimit -n {{ .Values.ulimitNofile }}; exec ./launch_service"]
          ports:
            - containerPort: {{ .Values.service.port }}
          volumeMounts:
            - name: cfg                 # autoconfig 写的 config.yaml(整卷挂到 /workspace/configs)
              mountPath: /workspace/configs
          {{- if .Values.probes.enabled }}
          startupProbe:                 # 慢启动预算:端口起来前不判 live/ready(最多 ~60s)
            tcpSocket: { port: {{ .Values.service.port }} }
            periodSeconds: 2
            failureThreshold: 30
          livenessProbe:                # startup 过后才生效 → snappy 快抓假死
            tcpSocket: { port: {{ .Values.service.port }} }
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:               # startup 过后端口已在 → 秒 Ready;谁收流量由 ha-active 标签定
            tcpSocket: { port: {{ .Values.service.port }} }
            periodSeconds: 2
            failureThreshold: 2
          {{- end }}
          resources: {{- toYaml .Values.resources | nindent 12 }}
        {{- if .Values.reload.enabled }}
        - name: reload
          image: {{ .Values.reload.image }}
          args: ["--watch", "/workspace/configs", "--process", {{ .Values.reload.process | quote }}]
          volumeMounts:
            - name: cfg
              mountPath: /workspace/configs
        {{- end }}
        {{- if .Values.ha.enabled }}
        - name: hagate                  # master-standby:只有 leader 给自己打 cart-active 标签 → 只有它进 Service
          image: {{ .Values.ha.image }}
          args: ["--lease", "{{ include "cart.fullname" . }}-ha", "--http", ":{{ .Values.ha.port }}", "--app-tcp", {{ .Values.ha.appTcp | quote }}, "--label-key", "{{ include "cart.name" . }}-active"]
          env:
            - { name: POD_NAME,      valueFrom: { fieldRef: { fieldPath: metadata.name } } }
            - { name: POD_NAMESPACE, valueFrom: { fieldRef: { fieldPath: metadata.namespace } } }
          resources:
            requests: { cpu: 10m, memory: 32Mi }
            limits: { cpu: 200m, memory: 64Mi }
        {{- end }}
      volumes:
        - name: cfg
          configMap:
            name: {{ include "cart.configMapName" . }}   # chart 建初值,autoconfig 更新
      {{- /* 自定义 affinity 与「主备分散」是叠加关系,不是二选一:只写 nodeAffinity
             (把 CART 钉到某类节点)时,下面的 podAntiAffinity 仍然保留 —— 否则 2 个
             副本可能落到同一台,主备 HA 就白做了。要改/关掉分散,自己写一份
             podAntiAffinity 覆盖即可。 */}}
      {{- $aff := deepCopy (.Values.affinity | default dict) }}
      {{- if and .Values.ha.enabled (not (hasKey $aff "podAntiAffinity")) }}
      {{- $spread := dict "preferredDuringSchedulingIgnoredDuringExecution" (list (dict
            "weight" 100
            "podAffinityTerm" (dict
              "topologyKey" "kubernetes.io/hostname"
              "labelSelector" (dict "matchLabels" (include "cart.selectorLabels" . | fromYaml))))) }}
      {{- $aff = set $aff "podAntiAffinity" $spread }}
      {{- end }}
      {{- with $aff }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations: {{- toYaml . | nindent 8 }}
      {{- end }}
