apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "cache_aware_router.fullname" . }}
  labels: {{- include "cache_aware_router.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicas }}
  selector:
    matchLabels: {{- include "cache_aware_router.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels: {{- include "cache_aware_router.selectorLabels" . | nindent 8 }}
      {{- with .Values.podAnnotations }}
      annotations: {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      {{- if .Values.ha.enabled }}
      serviceAccountName: {{ include "cache_aware_router.fullname" . }}   # ha-gate 用它管 Lease
      {{- end }}
      {{- if .Values.reload.enabled }}
      shareProcessNamespace: true
      {{- end }}
      {{- if .Values.waitForWorkers }}
      initContainers:
        # 等 autoconfig 把真 workers(url: http://...)写进 config.yaml 再启 cart —— CART 拒绝空 workers 会崩溃循环。
        # 停在 Init 而非 CrashLoop;workers 就绪(或 ~10min 超时兜底)后放行。用 cart 镜像自身(已在,免额外拉)。
        - name: wait-workers
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          command: ["sh", "-c", "for i in $(seq 1 300); do grep -qE 'url:[[:space:]]*http' /workspace/configs/config.yaml 2>/dev/null && { echo 'workers ready'; exit 0; }; echo \"[$i] 等 autoconfig 写 workers...\"; sleep 2; done; echo 'timeout, 仍放行'; exit 0"]
          volumeMounts:
            - name: cfg
              mountPath: /workspace/configs
      {{- end }}
      containers:
        - name: cart
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["sh", "-c", "ulimit -n {{ .Values.ulimitNofile }}; exec ./launch_service"]
          ports:
            - containerPort: {{ .Values.service.port }}
          volumeMounts:
            - name: cfg                 # autoconfig 写的 config.yaml(整卷挂到 /workspace/configs)
              mountPath: /workspace/configs
          {{- if .Values.probes.enabled }}
          startupProbe:                 # 慢启动预算:端口起来前不判 live/ready(最多 ~60s)
            tcpSocket: { port: {{ .Values.service.port }} }
            periodSeconds: 2
            failureThreshold: 30
          livenessProbe:                # startup 过后才生效 → snappy 快抓假死
            tcpSocket: { port: {{ .Values.service.port }} }
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:               # startup 过后端口已在 → 秒 Ready;谁收流量由 ha-active 标签定
            tcpSocket: { port: {{ .Values.service.port }} }
            periodSeconds: 2
            failureThreshold: 2
          {{- end }}
          resources: {{- toYaml .Values.resources | nindent 12 }}
        {{- if .Values.reload.enabled }}
        - name: reload
          image: {{ .Values.reload.image }}
          args: ["--watch", "/workspace/configs", "--process", {{ .Values.reload.process | quote }}]
          volumeMounts:
            - name: cfg
              mountPath: /workspace/configs
        {{- end }}
        {{- if .Values.ha.enabled }}
        - name: hagate                  # master-standby:只有 leader 给自己打 cart-active 标签 → 只有它进 Service
          image: {{ .Values.ha.image }}
          args: ["--lease", "{{ include "cache_aware_router.fullname" . }}-ha", "--http", ":{{ .Values.ha.port }}", "--app-tcp", {{ .Values.ha.appTcp | quote }}, "--label-key", "{{ include "cache_aware_router.name" . }}-active"]
          env:
            - { name: POD_NAME,      valueFrom: { fieldRef: { fieldPath: metadata.name } } }
            - { name: POD_NAMESPACE, valueFrom: { fieldRef: { fieldPath: metadata.namespace } } }
          resources:
            requests: { cpu: 10m, memory: 32Mi }
            limits: { cpu: 200m, memory: 64Mi }
        {{- end }}
      volumes:
        - name: cfg
          configMap:
            name: {{ include "cache_aware_router.configMapName" . }}   # chart 建初值,autoconfig 更新
      {{- if or .Values.affinity .Values.ha.enabled }}
      affinity:
        {{- if .Values.affinity }}
        {{- toYaml .Values.affinity | nindent 8 }}
        {{- else }}
        podAntiAffinity:                # 主备尽量分散到不同节点(软约束)
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels: {{- include "cache_aware_router.selectorLabels" . | nindent 20 }}
        {{- end }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations: {{- toYaml . | nindent 8 }}
      {{- end }}
