image:
  # 公共 registry(Docker Hub 的 4pdosc org),仓外用户开箱可拉。
  # 内网部署显式覆盖成 harbor.4pd.io/hardcore-tech/cache_aware_router。
  repository: 4pdosc/cache_aware_router
  tag: ""              # 缺省用 Chart.appVersion(见 Chart.yaml)
  pullPolicy: IfNotPresent

replicas: 2                # master-standby:2 副本,只有 leader 收流量(单 active 保缓存 + 计数正确)

# waitForWorkers:加个 initContainer 等 autoconfig 把真 workers 写进 config.yaml 再启 cart。
# CART 拒绝空 workers → 会退出崩溃循环(CrashLoopBackOff),直到 autoconfig 写 workers 才恢复。
# 有了它:pod 停在 Init(等依赖)而非 CrashLoop,workers 就绪后一次性干净启动。设 false 关(如手填了 workers)。
waitForWorkers: true

# master-standby(主备):ha-gate sidecar 选举,只有 leader 通过 readiness → 只有它进 Service。
# CART 有本地 radix 缓存,active-active 会分裂缓存 → 命中率下降;单 active 保持一份热缓存。
ha:
  enabled: true
  # ⚠️ 这两个 sidecar 镜像来自 autoconfig 仓,不是本仓的产物,版本要跟 autoconfig 的发版走。
  # 默认值指向公共 registry(Docker Hub 的 4pdosc org),让仓外用户能开箱即用;
  # 内网部署【必须显式覆盖】成 harbor.4pd.io/hardcore-tech/autoconfig-hagate:<ver>,
  # 生产集群出不了外网,吃默认值会 ImagePullBackOff —— 而 sidecar 是同 pod 的普通容器,
  # 拉不到整个 pod 都起不来。详见 reload.image 那里的同款提醒。
  image: 4pdosc/autoconfig-hagate:0.3.31
  port: 8081
  appTcp: "127.0.0.1:8071"

probes:
  enabled: true       # startup+liveness(+readiness)总开关(Helm 约定,非 k8s 语法)

podDisruptionBudget:
  enabled: true
  minAvailable: 1

# CART 配置 ConfigMap(config.yaml):chart 建**底稿**(server/cache/health),autoconfig 只重填 workers 段。
# 这就是 CART 的 base——per-model 的 port/cache 等直接改这里(每个模型一个 cart release)。不再有单独的 baseConfigRef。
# ⚠️ cart 是【一个模型一个】,此 CM 也按模型独立。名字默认 = <fullname>-config(按 release 唯一,多 cart 同 ns 不撞);
#    ModelRoute.cart.outputConfigMap 指到这个名,或指到某个覆盖层 CM(见 extraConfigs)。
configMapName: ""

# 底稿 config.yaml(server/cache/health)。workers 由 autoconfig 写(落点是本 CM 或某个覆盖层 CM);
# standalone(无 autoconfig)时可在此直接写死 workers。
baseConfig: |
  server:
    host: "0.0.0.0"
    port: 8071
  cache:
    threshold: 0.1
    balance_abs_threshold: 10
    max_tree_size: 5000000
    daily_cleanup_hour_utc: 21
  proxy:
    add_routed_peer_header: true
    remote_media_url_policy: 400
  health:
    endpoint: "/health"
    interval_secs: 10

# 覆盖层:和底稿同一个 ConfigMap,额外 N 个 key,按本列表顺序追加到 `-c` 后面(底稿在最前)。
# 后者覆盖前者:mapping 逐键合并,list/标量整体替换,空文件不生效。
# 标 autoconfig: true 的那条(最多一条)归 autoconfig:chart 不渲染它的内容,ModelRoute.cart.outputKey
# 指它,于是模板里没有这个 key,helm upgrade 永远不会盖掉 autoconfig 写进去的 workers。
# 留空([])= 旧行为:autoconfig 直接重写底稿的 config.yaml。
configOverlays: []
#   - key: workers.yaml     # autoconfig 的落点;chart 不建这个 key,首次 reconcile 由 autoconfig 写出
#     autoconfig: true
#   - key: tuning.yaml      # chart 自己管的调参
#     content: |
#       cache:
#         threshold: 0.3

# launch_service 要求 ulimit -n ≥ 65535
ulimitNofile: 65535

reload:
  enabled: true
  # ⚠️ 同 ha.image:来自 autoconfig 仓,默认公共 registry,内网部署必须显式覆盖成 harbor 的。
  image: 4pdosc/autoconfig-reload:0.3.31
  process: "cache-aware-router"

service:
  type: ClusterIP
  port: 8071           # 需与 ModelRoute.cart.port 一致(openresty 按此路由到 CART)

resources:
  requests: { cpu: 200m, memory: 256Mi }
  limits: { cpu: "4", memory: 16Gi }

podAnnotations: {}
nodeSelector: {}
tolerations: []
# 与 ha.enabled 的「主备分散到不同节点」叠加,不是替换:这里只写 nodeAffinity 时,
# 那条 podAntiAffinity 仍在。自己写 podAntiAffinity 才会覆盖它。
affinity: {}
nameOverride: ""
fullnameOverride: ""

# terminationGracePeriodSeconds:唯一硬切刀,到点 SIGKILL 强砍在途流。cart 转发 SSE 长流(LLM 64K 输出可能上千秒),
# 须按最长流式响应设,否则吃 k8s 默认 30s → rollout 时 >30s 的在途流会被切(hagate graceful-drain 保住 flow 也没用,
# grace 到期即 SIGKILL;2026-08-13 实测 40s 流在 30s 处被切 CURLEXIT=18)。与 openresty chart 对齐。
terminationGracePeriodSeconds: 3600
