image:
  repository: harbor.4pd.io/hardcore-tech/cache_aware_router
  tag: ""              # 缺省用 Chart.appVersion(v0.6.0)
  pullPolicy: IfNotPresent

replicas: 2                # master-standby:2 副本,只有 leader 收流量(单 active 保缓存 + 计数正确)

# waitForWorkers:加个 initContainer 等 autoconfig 把真 workers 写进 config.yaml 再启 cart。
# CART 拒绝空 workers → 会退出崩溃循环(CrashLoopBackOff),直到 autoconfig 写 workers 才恢复。
# 有了它:pod 停在 Init(等依赖)而非 CrashLoop,workers 就绪后一次性干净启动。设 false 关(如手填了 workers)。
waitForWorkers: true

# master-standby(主备):ha-gate sidecar 选举,只有 leader 通过 readiness → 只有它进 Service。
# CART 有本地 radix 缓存,active-active 会分裂缓存 → 命中率下降;单 active 保持一份热缓存。
ha:
  enabled: true
  image: harbor.4pd.io/hardcore-tech/autoconfig-hagate:0.3.25
  port: 8081
  appTcp: "127.0.0.1:8071"

probes:
  enabled: true       # startup+liveness(+readiness)总开关(Helm 约定,非 k8s 语法)

podDisruptionBudget:
  enabled: true
  minAvailable: 1

# CART 配置 ConfigMap(config.yaml):chart 建**唯一底稿**(server/cache/health),autoconfig 只重填 workers 段。
# 这就是 CART 的 base——per-model 的 port/cache 等直接改这里(每个模型一个 cart release)。不再有单独的 baseConfigRef。
# ⚠️ cart 是【一个模型一个】,此 CM 也按模型独立。名字默认 = <fullname>-config(按 release 唯一,多 cart 同 ns 不撞);
#    ModelRoute.cart.outputConfigMap 必须指到这个名。留空用默认,或显式覆盖。
configMapName: ""

# 底稿 config.yaml(server/cache/health + 占位 workers)。autoconfig 保留这部分、只替换 workers:;
# standalone(无 autoconfig)时可在此直接写死 workers。
baseConfig: |
  server:
    host: "0.0.0.0"
    port: 8071
  cache:
    threshold: 0.3
  health:
    endpoint: "/health"
    interval_secs: 10
  workers: []

# launch_service 要求 ulimit -n ≥ 65535
ulimitNofile: 65535

reload:
  enabled: true
  image: harbor.4pd.io/hardcore-tech/autoconfig-reload:0.3.25
  process: "cache-aware-router"

service:
  type: ClusterIP
  port: 8071           # 需与 ModelRoute.cart.port 一致(openresty 按此路由到 CART)

resources:
  requests: { cpu: 200m, memory: 256Mi }
  limits: { cpu: "4", memory: 4Gi }

podAnnotations: {}
nodeSelector: {}
tolerations: []
affinity: {}
nameOverride: ""
fullnameOverride: ""
