# Cache-Aware Router Configuration
# Only 'workers' is required. All other fields show their defaults.

server:
  host: "0.0.0.0"
  port: 6700

# Backend vLLM worker URLs (required, list)
workers:
  - url: "http://node1:8050"
    max_load: 20
  - url: "http://node2:8050"
    max_load: 20

cache:
  # Minimum prefix match ratio to use cache-affinity routing (0.0-1.0)
  threshold: 0.3
  # Threshold triggers routing regardless of ratio (0 to disable)
  match_abs_threshold: 8192
  # Absolute load difference threshold for imbalance detection
  balance_abs_threshold: 5
  # Relative load ratio threshold for imbalance detection
  balance_rel_threshold: 1.25
  # LRU eviction interval in seconds (0 to disable)
  eviction_interval_secs: 60
  # Maximum nodes per radix tree before eviction
  max_tree_size: 1048576
  # Hour (0-23 UTC) to run daily full tree cleanup (-1 to disable)
  daily_cleanup_hour_utc: -1

health:
  endpoint: "/health"
  interval_secs: 10
  failure_threshold: 3
  success_threshold: 1

proxy:
  max_retries: 1
  initial_backoff_ms: 100
  max_backoff_ms: 5000
  backoff_multiplier: 2.0
  jitter_factor: 0.25
  request_timeout_secs: 10000
  # Connect-phase timeout (TCP+TLS establish) in seconds; independent of request_timeout.
  # Lets dead/blackhole backends fail fast (~2s) instead of ~30s (reqwest's internal connect timeout;
  # the OS default is longer ~130s but reqwest cuts it at ~30s). Long streams unaffected.
  connect_timeout_secs: 2
  add_routed_peer_header: false
  max_body_size: 10485760
  # HTTP status code for remote media URLs (200=allow, 4xx/5xx=reject with that code)
  remote_media_url_policy: 200

circuit_breaker:
  failure_threshold: 5
  success_threshold: 2
  timeout_secs: 30

logging:
  level: "info"
