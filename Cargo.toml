[package]
name = "cache-aware-router"
version = "0.2.0"
edition = "2021"

[[bin]]
name = "cache-aware-router"
path = "src/main.rs"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.13", features = ["stream", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
arc-swap = "1"
dashmap = "6"
parking_lot = "0.12"
clap = { version = "4", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
rand = "0.9"
http = "1"
bytes = "1"
futures-util = "0.3"
pin-project-lite = "0.2"
libc = "0.2"

[profile.release]
opt-level = 3
lto = true
debug-assertion = true
overflow-checks = true
panic = 'abort'

[dev-dependencies]
tempfile = "3"
